name: build-module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          ls "$ANDROID_HOME" || true
          SDKM=$(find "$ANDROID_HOME" -path '*/bin/sdkmanager' | head -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          ls "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Shell static checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          sh -n scripts/edit_today_screentime.sh
          shellcheck -s sh scripts/edit_today_screentime.sh

      - name: Host protocol smoke test
        run: python3 tests/test_plan_math.py

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: bash module/build.sh

      - name: Verify APK contents
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          unzip -l module/dist/screentime-editor-module.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging module/dist/screentime-editor-module.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose module/dist/screentime-editor-module.apk
          unzip -p module/dist/screentime-editor-module.apk assets/xposed_init | grep -qx 'com.screentime.editor.Hook'
          unzip -p module/dist/screentime-editor-module.apk assets/edit_today_screentime.sh.gz | gzip -t

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" module/dist/screentime-editor-module.apk             --title "ScreenTime Editor $TAG"             --notes "Built from ${GITHUB_SHA}. Controller script is embedded as a gzip asset."

# Manual releases only.
